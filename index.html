<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROM_MONEY</title>
<meta http-equiv="refresh" content="0; url=./money/">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#085041;color:#fff;font-family:-apple-system,'Segoe UI',Roboto,sans-serif}
  body{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  a{color:#F5A623;font-weight:700}
</style>
</head>
<body>
  <div>
    <p>Redirection vers ROM_MONEY...</p>
    <p><a href="./money/">Cliquez ici si rien ne se passe</a></p>
  </div>
  <script>
    // Deux buts ici : (1) rediriger immediatement vers le nouvel emplacement
    // du frontend ROM_MONEY tout en preservant la chaine de requete (liens de
    // parrainage ?ref=, liens de paiement marchand ?pay=, tous deux lus par
    // money/index.html via URLSearchParams(location.search) - aucun besoin de
    // modifier cette logique, elle continue de fonctionner une fois deplacee) ;
    // (2) desenregistrer toute Service Worker deja active a la racine, pour
    // que les utilisateurs ayant deja installe ROM_MONEY avant ce changement
    // ne restent pas bloques sur l'ancienne coquille mise en cache.
    try {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs){
          regs.forEach(function(r){ r.unregister(); });
        }).catch(function(){});
      }
    } catch(e) {}
    location.replace('./money/' + location.search);
  </script>
</body>
</html>
